<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M9 Muhasebe — Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bt-surface-primary-light, #fafafa);
    font-family: var(--font);
  }
  .m9-login-card {
    width: 360px;
    max-width: calc(100vw - 32px);
    background: var(--bt-base-default, #fff);
    border: 1px solid var(--bt-border-primary-default, #d4d4d4);
    border-radius: var(--bt-radius-md, 6px);
    padding: var(--bt-space-4xl, 24px);
    display: flex;
    flex-direction: column;
    gap: var(--bt-space-2xl, 16px);
  }
  .m9-login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--bt-space-md, 8px);
    margin-bottom: var(--bt-space-xs, 4px);
  }
  .m9-login-mark {
    width: 48px;
    height: 48px;
    border-radius: var(--bt-radius-md, 6px);
    border: 0.75px solid #fff;
    background: linear-gradient(-45deg, var(--bt-gray-900, #1a1a1a) 0%, var(--bt-gray-800, #272727) 29%, var(--bt-gray-600, #535353) 100%);
    box-shadow: inset -0.5px -0.5px 0.5px rgba(0,0,0,.05), inset 0.5px 0.5px 0.5px rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .02em;
  }
  .m9-login-title { font: var(--bt-text-lg-semibold, 600 18px/24px var(--font)); color: var(--bt-text-primary-default, #1a1a1a); }
  .m9-login-sub { font-size: var(--bt-text-xs-size, 12px); color: var(--bt-text-primary-muted, #a3a3a3); text-align: center; }
  .m9-login-form { display: flex; flex-direction: column; gap: var(--bt-space-xl, 12px); }
  .m9-login-row { display: flex; align-items: center; justify-content: space-between; }
  .m9-login-link { font-size: var(--bt-text-xs-size, 12px); color: var(--bt-primary-default, #0d4e97); text-decoration: none; cursor: pointer; }
  .m9-login-link:hover { text-decoration: underline; }
  .m9-login-error {
    display: none;
    font-size: var(--bt-text-xs-size, 12px);
    color: var(--bt-text-error-default, #b31d38);
    background: var(--bt-red-100, #fde6e6);
    border: 1px solid var(--bt-border-error-default, #f3b4bd);
    border-radius: var(--bt-radius-sm, 4px);
    padding: var(--bt-space-sm, 6px) var(--bt-space-md, 8px);
  }
  .m9-login-footer { text-align: center; font-size: var(--bt-text-xs-size, 12px); color: var(--bt-text-primary-muted, #a3a3a3); margin-top: var(--bt-space-xs, 4px); }
</style>
</head>
<body>

  <form class="m9-login-card" id="m9LoginForm" autocomplete="on">

    <div class="m9-login-brand">
      <div class="m9-login-mark">M9</div>
      <div class="m9-login-title">M9 Muhasebe</div>
      <div class="m9-login-sub">Hesabınıza giriş yapın</div>
    </div>

    <div class="m9-login-error" id="m9LoginError">Kullanıcı adı veya şifre hatalı.</div>

    <div class="m9-login-form">

      <!-- E-posta — gerçek bt-input / bt-textbox yapısı -->
      <div class="bt-input bt-textbox bt-input--md">
        <div class="bt-input__label-value"><span class="bt-input__label">E-posta</span></div>
        <div class="bt-input__box bt-input__box--md">
          <div class="bt-input__content">
            <input class="bt-input__value" type="email" name="email" placeholder="ornek@sirket.com" required oninput="tbxBaseInput(this)" />
          </div>
        </div>
      </div>

      <!-- Şifre -->
      <div class="bt-input bt-textbox bt-input--md">
        <div class="bt-input__label-value"><span class="bt-input__label">Şifre</span></div>
        <div class="bt-input__box bt-input__box--md">
          <div class="bt-input__content">
            <input class="bt-input__value" type="password" name="password" placeholder="••••••••" required oninput="tbxBaseInput(this)" />
          </div>
        </div>
      </div>

      <div class="m9-login-row">
        <span></span>
        <a class="m9-login-link" href="#" onclick="return false;">Şifremi unuttum</a>
      </div>

      <button type="submit" class="bt-btn bt-btn--primary-solid bt-btn--md" style="justify-content:center;width:100%;">Giriş Yap</button>

    </div>

    <div class="m9-login-footer">© 2026 M9 Muhasebe</div>

  </form>

<script src="js/components.js"></script>
<script>
  // Backend henüz yok — form submit'i şimdilik app.html'e yönlendiriyor.
  // Gerçek kimlik doğrulama bağlanınca bu handler değiştirilecek.
  document.getElementById('m9LoginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'app.html';
  });
</script>
</body>
</html>
