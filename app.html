<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M9 Muhasebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  /* .sbx-shell'in kendi CSS'i (styles.css) docs playground önizlemesi için
     sabit height:460px + kart border/box-shadow taşıyor — gerçek uygulama
     kabuğunda tam yükseklik ve kenardan kenara (border'sız) olması gerekiyor.
     Docs sitesinin ".iso-shell--app .bt-pl-frame" ile aynı amaç, aynı
     pattern: sadece boyut context'i override edilir, .sbx-shell'in kendisi
     değişmez. */
  .bt-pl-frame .sbx-shell { height: 100%; border: none; box-shadow: none; }
  /* Figma "M9 Design" › Main Page 1'de Toolbar SearchBox'ı 280px — page-layouts
     pattern'inin jenerik ".bt-pl-toolbar .bt-searchbox{width:180px}" varsayılanı
     bu spesifik ekran için override edilir. */
  #m9Toolbar .bt-searchbox { width: 280px; }
  /* .bt-pl-header-title'ın kendi CSS'i (styles.css) page-layouts pattern'inin
     jenerik "Title/lg/Semibold" (18px/600) stilini taşıyor — Figma'da bu
     ekranın Page Header'ı "Title/md/Regular" (16px/400/24px, Font/Family/Title
     = Geist) kullanıyor. */
  #m9PageTitle { font: 400 16px/24px var(--font); }
  /* #m9Grid artık .bt-grid-container DEĞİL, .bt-grid-actions-container
     kullanıyor (bkz. aşağıdaki HTML + design.md'deki "Data Table Actions'ta
     çift scrollbar / resize sonrası boşluk" notu, 2026-08-14) — tek fark
     .bt-pl-body .bt-grid-container{border-radius} kuralı o class'a özel,
     .bt-grid-actions-container'a uygulanmıyor; burada aynı değerle geri
     veriliyor. */
  #m9Grid { border-radius: var(--bt-radius-sm, 4px); }
  /* .bt-grid-actions-container'a geçiş kolonun GİZLENMESİNİ (önceki hatalı
     overflow-x:hidden fix'imin yan etkisi) düzeltti, ama ÇİFT SCROLL'u tam
     gidermedi — CSS'in "overflow-x/y'den biri 'visible' ise diğeri 'auto'
     olduğunda ikisi de 'auto'ya zorlanır" kuralı (styles.css'in Frozen
     Column/Actions geçmişinde "sticky'yi kıran" olarak belgelenen AYNI
     tuhaflık) yüzünden .bt-grid__body'nin overflow-y:auto'su overflow-x'i
     de örtük olarak auto yapıyor — .bt-grid-scroll-x'ten BAĞIMSIZ, kendi
     scrollLeft'i olan ikinci bir yatay scroll konteyneri oluşuyor (hareket
     ettirilince header'dan senkronsuz kalıp kolonları "kaybediyor").
     design.md'nin aynı notunda geçen ama benim kopyamda eksik kalan asıl
     çözüm: .bt-grid'i (header+body'nin ortak ebeveyni) GERÇEK içerik
     genişliğine (1840px, resize sonrası değişebilir) zorlamak — böylece
     .bt-grid__body'nin KENDİ içinde hiç taşma kalmıyor (scrollWidth ===
     clientWidth), örtük auto'nun gösterecek bir şeyi olmuyor, TÜM yatay
     scroll SADECE dış .bt-grid-scroll-x'te oluyor. */
  #m9Grid .bt-grid { min-width: max-content; }
  /* min-width:max-content taşmayı/kırpmayı giderdi ama CSS'in o tuhaflığı
     (yukarıdaki not) teorik olarak hâlâ .bt-grid__body'nin overflow-x'ini
     örtük "auto"ya çevirebiliyor — küçük bir piksel yuvarlama farkı (resize
     sırasında header/body hücre genişlikleri ayrı ayrı set edildiği için
     ihtimal dahilinde) bile ikinci, bağımsız bir scrollbar tetikleyebilir.
     Kesin çözüm: overflow-x'i AÇIKÇA 'hidden' yap (sadece overflow-y'yi
     bırakmak değil) — 'visible' olmayan bir değer kuralı hiç tetiklemiyor,
     yani artık body'nin KENDİ başına yatay scroll olma ihtimali tamamen
     ortadan kalkıyor; min-width:max-content zaten içeriğin asla kırpılmasını
     engelliyor, tüm yatay scroll SADECE .bt-grid-scroll-x'te kalıyor. */
  #m9Grid .bt-grid__body { overflow-x: hidden; }
</style>
</head>
<body>

  <!--
    Figma "M9 Design" › Main Page 1 (1697:25814) ile birebir:
    Hub Sidebar (collapsed, 48px) + Page Header (36px) + Toolbar (40px) +
    Data Table (kalan alan). Yapı/CSS: .bt-pl-* (Bentas Design System
    "Page Layouts" pattern'i, css/styles.css'te hazır).
  -->
  <div class="bt-pl-frame">

    <div id="m9Rail"></div>

    <div class="bt-pl-main">

      <div class="bt-pl-header">
        <span class="bt-pl-header-title" id="m9PageTitle">Kayıt Listesi</span>
      </div>

      <div class="bt-pl-toolbar" id="m9Toolbar"></div>

      <div class="bt-pl-body">
        <div class="bt-grid-actions-container" id="m9Grid"></div>
      </div>

    </div>

  </div>

<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
