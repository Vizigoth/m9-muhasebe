<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M9 Muhasebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  /* .sbx-shell'in kendi CSS'i (styles.css) docs playground önizlemesi için
     sabit height:460px + kart border/box-shadow taşıyor — gerçek uygulama
     kabuğunda tam yükseklik ve kenardan kenara (border'sız) olması gerekiyor.
     Docs sitesinin ".iso-shell--app .bt-pl-frame" ile aynı amaç, aynı
     pattern: sadece boyut context'i override edilir, .sbx-shell'in kendisi
     değişmez. */
  .bt-pl-frame .sbx-shell { height: 100%; border: none; box-shadow: none; }
  /* Figma "M9 Design" › Main Page 1'de Toolbar SearchBox'ı 280px — page-layouts
     pattern'inin jenerik ".bt-pl-toolbar .bt-searchbox{width:180px}" varsayılanı
     bu spesifik ekran için override edilir. */
  #m9Toolbar .bt-searchbox { width: 280px; }
  /* .bt-pl-header-title'ın kendi CSS'i (styles.css) page-layouts pattern'inin
     jenerik "Title/lg/Semibold" (18px/600) stilini taşıyor — Figma'da bu
     ekranın Page Header'ı "Title/md/Regular" (16px/400/24px, Font/Family/Title
     = Geist) kullanıyor. */
  #m9PageTitle { font: 400 16px/24px var(--font); }
  /* #m9Grid artık .bt-grid-container DEĞİL, .bt-grid-actions-container
     kullanıyor (bkz. aşağıdaki HTML + design.md'deki "Data Table Actions'ta
     çift scrollbar / resize sonrası boşluk" notu, 2026-08-14) — tek fark
     .bt-pl-body .bt-grid-container{border-radius} kuralı o class'a özel,
     .bt-grid-actions-container'a uygulanmıyor; burada aynı değerle geri
     veriliyor. */
  #m9Grid { border-radius: var(--bt-radius-sm, 4px); }
  /* Fiş Numarası kolonu frozen (position:sticky) — bu, styles.css'in kendi
     tarihinde belgelenen bir kuralla çakışıyor: .bt-grid__body'de HERHANGİ
     bir overflow değeri (görünürde hiç taşma olmasa bile — overflow-y:auto
     dahil, .bt-grid-actions-container'ın kendi kuralı) onu kendi başına bir
     scroll/containing-block'a çeviriyor, bu da içindeki sticky hücrelerin
     referans aldığı container'ı YANLIŞLIKLA .bt-grid-scroll-x yerine
     .bt-grid__body yapıp sticky'yi tamamen kırıyor (Data Table "Frozen
     Column" sayfasının kendi geçmişinde bulunmuş bir bug, bkz. styles.css
     .bt-grid__body yorumu). Bu yüzden SADECE frozen kolon kullanan bu
     sayfada overflow visible'a geri döndürülüyor — bilinen ödün: çok
     satır olursa dikey scroll güvenlik ağı kalmıyor (Bentas DS'in kendi
     .bt-grid-frozen-container'ı da aynı ödünü kabul ediyor). */
  #m9Grid .bt-grid__body { overflow: visible; }
  /* .bt-pl-toolbar'ın display:flex'i [hidden] attribute'unu eziyor — toolbar'ı
     olmayan ekranlar (bkz. router.js m9RenderPlaceholder) için geri veriliyor. */
  .bt-pl-toolbar[hidden] { display: none; }
  /* Henüz ekranı yazılmamış nav item'ları için geçici içerik */
  .m9-screen-placeholder {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    font: var(--bt-text-sm-regular, 400 14px/16px var(--font));
    color: var(--bt-text-primary-strong);
  }
  /* ── Fiş Detayı window (Figma "Window" 1738:135102) — .bt-window__body'nin
     varsayılan 16px padding'li tek-kart düzeni yerine kenardan kenara iki
     panel: sol form (440px) + sağ Hareketler. Zemin body'nin kendi
     --bt-surface-primary-light'ı (Figma Container fill'i ile aynı). */
  #m9RecordWindow .bt-window__body { padding: 0; flex-direction: row; overflow: hidden; }
  /* Window Toolbar (Figma 1742:138375) — Page Layout toolbar'ının aynısı
     (40px, beyaz, alt border, 16px yatay padding), tek fark Figma'daki
     sabit 10px buton aralığı. Sığmayan butonlar "⋯" Overflow Menu'ye
     taşınır (btToolbarFitOverflow) — taşma ölçümü için overflow:hidden. */
  .m9-fis-toolbar { gap: 10px; overflow: hidden; }
  .m9-fis-toolbar > .bt-btn,
  .m9-fis-toolbar > .bt-ovf-menu { flex-shrink: 0; }
  .m9-fis-toolbar > [hidden] { display: none; }
  /* Ünvan LookUp (sm window) — Fiş Detayı (xl) window'unun ÜSTÜNDE açılan ikinci
     pencere. DS'te overlay 999 / window 1000 — tek pencere için; iç içe açılınca
     ikinci overlay xl window'un altında kalıp karartmıyor/dışarı tıklamayı
     yakalamıyordu, bu yüzden bir kat yukarı alınıyor. */
  #m9UnvanLookupOv { z-index: 1001; }
  #m9UnvanLookup { z-index: 1002; }
  /* arama tam genişlik, grid kalan yüksekliği doldurur */
  #m9UnvanLookup .bt-window__panel { min-height: 0; overflow: hidden; }
  #m9UnvanLookup .bt-searchbox { flex-shrink: 0; width: 100%; }
  #m9UnvanLookupGrid { flex: 1; min-height: 0; border-radius: var(--bt-radius-sm, 4px); }
  /* Overflow Menu listesi açılınca body'ye portal'lanıyor ve DS'teki z-index'i
     200 — .bt-window (1000) içinden açıldığında pencerenin ARKASINDA kalıyordu. */
  body > .bt-ovf-menu__list[data-bt-ovf-portal="1"] { z-index: 1010; }

  .m9-fis-form {
    width: 440px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: var(--bt-space-2xl);
    padding: var(--bt-space-2xl);
    background: var(--bt-surface-primary-default);
    border-right: 1px solid var(--bt-border-primary-default);
    box-sizing: border-box;
    overflow-y: auto;
  }
  /* Segmented tab track'i Figma'da HUG — tam genişliğe yayılmasın */
  .m9-fis-form > .bt-tab-list { align-self: flex-start; flex-shrink: 0; }
  .m9-fis-form__tab { display: flex; flex-direction: column; gap: var(--bt-space-2xl); }
  .m9-fis-form__tab[hidden] { display: none; }
  .m9-fis-form__row { display: flex; gap: var(--bt-space-2xl); }
  .m9-fis-form__row > .bt-input { flex: 1; min-width: 0; }

  .m9-fis-moves {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    padding: var(--bt-space-2xl);
  }
  .m9-fis-moves__card {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: var(--bt-space-xl);
    background: var(--bt-surface-primary-default);
    border: 1px solid var(--bt-border-primary-default);
    border-radius: var(--bt-radius-sm);
  }
  .m9-fis-moves__header {
    padding: var(--bt-space-xs) var(--bt-space-2xl);
    border-bottom: 1px solid var(--bt-border-primary-default);
    flex-shrink: 0;
  }
  .m9-fis-moves__title { font: var(--bt-title-md-medium, 500 16px/24px var(--font)); color: var(--bt-text-primary-default); }
  .m9-fis-moves__subtitle { font: var(--bt-subtitle-xs-regular, 400 12px/16px var(--font)); color: var(--bt-text-primary-emphasis); }
  .m9-fis-moves__toolbar {
    display: flex; align-items: center; gap: 10px; /* Figma: sabit 10px, token'a bağlı değil */
    padding: 0 var(--bt-space-2xl);
    flex-shrink: 0;
  }
  .m9-fis-moves__toolbar .bt-searchbox { margin-left: auto; width: 320px; }
  .m9-fis-moves__content {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 0 var(--bt-space-2xl) var(--bt-space-2xl);
  }
  .m9-fis-moves__content { gap: var(--bt-space-2xl); }
  /* DataTable Summary (Figma 1748:158681) — grid altında, içeriğe göre (HUG)
     genişleyen toplam şeridi. Item 160px sabit, aralarında 1px×40px ayraç
     (Figma "Seperator", --bt-border-primary-default). */
  .m9-grid-summary {
    align-self: flex-start; flex-shrink: 0;
    display: flex; align-items: center; gap: var(--bt-space-xs);
    padding: var(--bt-space-xs);
    background: var(--bt-surface-primary-subtle);
    border: 1px solid var(--bt-border-primary-default);
    border-radius: var(--bt-radius-sm);
    max-width: 100%; overflow-x: auto; box-sizing: border-box;
  }
  .m9-grid-summary__item {
    width: 160px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: var(--bt-space-xs);
    padding: var(--bt-space-xs); box-sizing: border-box;
  }
  .m9-grid-summary__label { font: var(--bt-text-xs-medium, 500 12px/16px var(--font)); color: var(--bt-text-primary-default); }
  .m9-grid-summary__value { font: var(--bt-text-xs-regular, 400 12px/16px var(--font)); color: var(--bt-text-primary-default); font-variant-numeric: tabular-nums; }
  .m9-grid-summary__value--empty { color: var(--bt-text-primary-muted); }
  .m9-grid-summary__sep { width: 1px; height: 40px; flex-shrink: 0; background: var(--bt-border-primary-default); }
  /* bkz. #m9Grid notu — .bt-grid-actions-container'a radius ayrıca verilir */
  #m9DetailGrid { border-radius: var(--bt-radius-sm, 4px); }
  /* Sıra kolonu frozen — #m9Grid ile AYNI sebep/ödün: .bt-grid__body'nin
     overflow-y:auto'su sticky hücrelerin referansını bozuyor, visible'a
     dönülüyor (çok satırda dikey scroll güvenlik ağı kalmaz). */
  #m9DetailGrid .bt-grid__body { overflow: visible; }
</style>
</head>
<body>

  <!--
    Figma "M9 Design" › Main Page 1 (1697:25814) ile birebir:
    Hub Sidebar (collapsed, 48px) + Page Header (36px) + Toolbar (40px) +
    Data Table (kalan alan). Yapı/CSS: .bt-pl-* (Bentas Design System
    "Page Layouts" pattern'i, css/styles.css'te hazır).
  -->
  <div class="bt-pl-frame">

    <div id="m9Rail"></div>

    <div class="bt-pl-main">

      <div class="bt-pl-header">
        <span class="bt-pl-header-title" id="m9PageTitle"></span>
      </div>

      <!-- Toolbar + body aktif ekrana göre doldurulur (js/router.js, js/screens/*.js) -->
      <div class="bt-pl-toolbar" id="m9Toolbar"></div>

      <div class="bt-pl-body" id="m9Body"></div>

    </div>

  </div>

  <!-- Kayıt detay paneli — .bt-window (XL), bkz. js/app.js m9OpenRecordWindow -->
  <div id="m9WindowMount"></div>

<script src="js/components.js"></script>
<script src="js/router.js"></script>
<script src="js/screens/fis-listesi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
